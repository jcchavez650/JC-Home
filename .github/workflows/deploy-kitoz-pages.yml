name: Deploy Kitoz Burger site to GitHub Pages

# Publishes the static site in kitoz-burger/ to GitHub Pages.
# One-time setup: in the repo, go to Settings → Pages → Build and deployment
# → Source: "GitHub Actions". After that this workflow deploys automatically.

on:
  push:
    branches:
      - main
      - claude/smash-burger-3d-site-yj9bhc
    paths:
      - "kitoz-burger/**"
      - ".github/workflows/deploy-kitoz-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: kitoz-burger

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
