<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a6"/>
      <stop offset="0.5" stop-color="#f0b429"/>
      <stop offset="1" stop-color="#c9860a"/>
    </linearGradient>
  </defs>
  <!-- dark rounded background so the gold trophy pops in the browser tab -->
  <rect width="64" height="64" rx="14" fill="#0d1117"/>
  <!-- World Cup style trophy: bowl, twisting body, stepped base -->
  <g fill="url(#g)">
    <!-- side handles curving up -->
    <path d="M22 15c-5 1-8 5-8 10 0 4 2 7 6 8l1-4c-2-1-3-2-3-4 0-2 2-4 5-4z"/>
    <path d="M42 15c5 1 8 5 8 10 0 4-2 7-6 8l-1-4c2-1 3-2 3-4 0-2-2-4-5-4z"/>
    <!-- bowl / cup -->
    <path d="M22 13h20c0 12-4 19-10 22-6-3-10-10-10-22z"/>
    <!-- twisting body -->
    <path d="M28 33c2.4 1.6 5.6 1.6 8 0l-2 12.5c-.2 1.4-1 2.6-2 3.5-1-.9-1.8-2.1-2-3.5L28 33z"/>
    <!-- stepped base -->
    <rect x="24" y="48" width="16" height="4.5" rx="1.5"/>
    <rect x="20" y="53" width="24" height="6" rx="2.5"/>
  </g>
</svg>
